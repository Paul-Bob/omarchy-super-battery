name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Alert rules, power saver, charge limit, settings
        run: node test/test_model.js
      - name: bin/charge-limit against fake sysfs trees
        run: bash test/test_charge_limit.sh
      - name: bin/add-sound with a stand-in file chooser
        run: bash test/test_add_sound.sh
